name: Validate
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run stage-mod
      - run: npm run release:check
  lua:
    # The mod runs under Balatro's LuaJIT; its Lua code has no platform-specific paths.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y luajit
      - run: luajit tests/observation.test.lua
      - run: luajit tests/decision.test.lua
      - run: luajit tests/score-snapshot.test.lua
